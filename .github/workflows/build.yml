name: Build Plugins

permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
      - '.github/assets/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
      - '.github/assets/**'
      - '.github/ISSUE_TEMPLATE/**'
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect changed files
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            core:
              - 'Hi3Helper.Hypergryph.Core/**'
              - 'Hi3Helper.Hypergryph.Shared/**'
              - 'Hi3Helper.Plugin.Core'
              - 'Hi3Helper.Plugin.Core/**'
              - 'SevenZipExtractor'
              - 'SevenZipExtractor/**'
              - 'SharpHDiffPatch.Core/**'
              - '.github/**'
              - '*.props'
              - '*.targets'
              - '*.sln'
              - 'global.json'
            endfield:
              - 'Hi3Helper.Plugin.Endfield/**'
            arknights:
              - 'Hi3Helper.Plugin.Arknights/**'
              - 'Hi3Helper.Hypergryph.Yostar/**'

      - name: Determine Build Matrix
        id: set-matrix
        env:
          CORE: ${{ steps.filter.outputs.core }}
          ENDFIELD: ${{ steps.filter.outputs.endfield }}
          ARKNIGHTS: ${{ steps.filter.outputs.arknights }}
        run: |
          result='[]'
          if [[ "$CORE" == true || "$ENDFIELD" == true ]]; then
            result=$(jq -c '. + ["Hi3Helper.Plugin.Endfield"]' <<< "$result")
          fi
          if [[ "$CORE" == true || "$ARKNIGHTS" == true ]]; then
            result=$(jq -c '. + ["Hi3Helper.Plugin.Arknights"]' <<< "$result")
          fi
          echo "matrix=$result" >> "$GITHUB_OUTPUT"

      - name: Test release tooling
        shell: pwsh
        run: ./.github/scripts/Test-PluginRelease.ps1

  build:
    needs: prepare
    if: needs.prepare.outputs.matrix != '[]'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup .NET 10.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore and Publish ${{ matrix.plugin }}
        shell: pwsh
        run: |
          dotnet restore ${{ matrix.plugin }}/${{ matrix.plugin }}.csproj `
            -r win-x64

          dotnet publish ${{ matrix.plugin }}/${{ matrix.plugin }}.csproj `
            -c Debug `
            -r win-x64 `
            --self-contained true `
            -p:PublishProfile=DebugNoReflectionPublish `
            --no-restore `
            -o ./publish_output/${{ matrix.plugin }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.plugin }}-DebugNoReflectionPublish
          path: |
            ./publish_output/${{ matrix.plugin }}/**
